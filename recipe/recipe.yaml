schema_version: 1

context:
  version: "3.18.0"

package:
  name: reorder_python_imports
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/reorder_python_imports/reorder_python_imports-${{ version }}.tar.gz
  sha256: 89e73e4e30a6272117daedd5b2573d2e03f9a40bc9676999d2617c8618a3e34d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - reorder-python-imports = reorder_python_imports:main

requirements:
  host:
    - python =${{ python_min }}
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - classify-imports >=4.1

tests:
  - python:
      imports:
        - reorder_python_imports
  - requirements:
      run:
        - pip
        - python =${{ python_min }}
    script:
      - pip check
      - reorder-python-imports --help

about:
  summary: Tool for reordering python imports
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/asottile/reorder-python-imports

extra:
  recipe-maintainers:
    - danielnachun
